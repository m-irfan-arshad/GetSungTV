# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# Kotlin code style for this project: "official" or "obsolete":
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# Parallel execution across modules — major speedup for 14-module project
org.gradle.parallel=true
# Build cache — skips compilation for unchanged modules (local + CI)
org.gradle.caching=true
# Configuration cache — skips the entire ~2min config phase on subsequent runs
# First run builds the cache; every run after is instant config.
org.gradle.configuration-cache=true
# Configure only the modules actually needed for the requested task
org.gradle.configureondemand=true
# Kotlin code style for this project: "official" or "obsolete":
android.useAndroidX=true
# android.enableJetifier removed — deprecated and defaulted to false in AGP 9+
kotlin.incremental=false
kotlin.code.style=official
android.disallowKotlinSourceSets=false
# android.databinding.incremental removed — deprecated since AGP 8.1
# android.databinding.enableV2 removed — removed from AGP 9+
ksp.incremental=false
org.gradle.warning.mode=all
android.nonTransitiveRClass=false